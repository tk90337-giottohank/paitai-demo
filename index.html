<!DOCTYPE html><html lang="zh-Hant"><head>
<meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>排檯系統原型</title><style>
body{font-family:sans-serif;margin:0;background:#1b1d24;color:#eee}header{padding:10px 16px;background:#2a2d38;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:20px;margin:0 10px 0 0}button{font-size:15px;padding:8px 12px;border:0;border-radius:6px;background:#3d6df2;color:#fff;cursor:pointer}button.s{background:#555}
main{display:grid;grid-template-columns:2fr 1fr;gap:12px;padding:12px}#rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.room{background:#2f3340;border-radius:10px;padding:10px;min-height:120px;border:3px solid #444}.room.busy{border-color:#3c9}.room.soon{border-color:#f33;animation:b 1s infinite}
@keyframes b{50%{background:#5a2020}}.room h3{margin:0 0 4px}.g{background:#444;border-radius:5px;padding:3px 6px;margin:3px 0;font-size:14px}.red{border-left:4px solid #f44}.pen{font-size:11px;padding:0 3px;border-radius:3px;margin-right:3px}.fill{border-left:4px solid #3c9}.tag{border-left:4px solid #fc3}.g.alert{background:#c60}.blue{border-left:4px solid #49f}.auto{border-left:4px solid #c5f}
section{background:#262933;border-radius:10px;padding:10px;margin-bottom:12px}.h{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #333}
#log{max-height:220px;overflow:auto;font-size:13px}dialog{background:#2a2d38;color:#eee;border-radius:10px;border:0}label{display:block;margin:6px 0}input,select{font-size:15px;padding:4px}
@media (max-width:700px){main{grid-template-columns:1fr;padding:6px}#rooms{grid-template-columns:1fr 1fr;gap:6px}
header{gap:6px;padding:8px}h1{font-size:16px;width:100%}header button,header label{flex:1 1 45%;min-height:44px}header input{width:60px}
button,select{min-height:44px}.room{min-width:0;padding:8px}.room button{padding:6px 8px}
#girls{grid-template-columns:1fr!important;max-height:50vh!important}dialog{width:100vw;max-width:100vw;height:100vh;max-height:100vh;margin:0;box-sizing:border-box;overflow:auto}
dialog input[type=text]{width:100%;box-sizing:border-box}#sugg{width:100%}#guest>div:first-child{flex-wrap:wrap}table{font-size:12px!important}}
#toasts{pointer-events:none}@media (max-width:700px){#toasts{top:auto!important;bottom:8px;width:92%}#toasts div{font-size:14px!important;padding:6px 10px!important}}body{overflow-x:hidden}*{box-sizing:border-box}
</style></head><body>
<header><h1 id="store"></h1><span id="clock"></span><button onclick="openSettings()">⚙ 店家設定</button><label style="margin:0">操作幹部 <input id=op size=5 oninput="S.op=this.value;save()"></label><label style="margin:0">等候客 <input id=wait type=number style="width:50px" oninput="S.waiting=+this.value;save()"></label><button id=modeBtn onclick="setMode(S.mode=='忙'?'閒':'忙')"></button><span id=sugg style="font-size:13px;color:#fc6"></span><button class="s" onclick="openGuest()">客人點檯（包廂平板）</button><button class="s" onclick="openReport()">月出勤報表</button><button class="s" onclick="openAuto()">同台互轉 auto</button><button class="s" onclick="if(confirm('重設示範資料？')){localStorage.removeItem(K);location.reload()}">重設</button></header>
<main><div><div id="rooms"></div></div><div>
<section><b>紅筆點檯請求</b><div id=reqs></div></section><section><b>女孩名冊（示範資料）</b><span id=cnt></span><br><input id=q placeholder='搜尋編號/名字' oninput=render() size=12> <select id=fl onchange=render()><option value=''>全部</option><option>休息室</option><option>在檯</option><option>休息</option><option>未到</option><option>請假</option></select><div id="girls" style='max-height:340px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:4px'></div></section>
<section><b>模擬感應（門口讀卡器）</b><br>包廂 <select id=sr></select> 標籤 <input id=stag value="TAG08" size=7> <select id=sd><option value=in>進</option><option value=out>出</option><option value="">未知</option></select> <button onclick="handleDoorEvent({readerId:'R-'+sr.value,roomId:sr.value,tagId:stag.value.trim(),timestamp:Date.now(),direction:sd.value||null})">送出感應</button></section>
<section><b>同台群組</b><div id="autos"></div></section>
<section><b>事件紀錄</b><div id="log"></div></section></div></main>
<div id=guest style='display:none;position:fixed;inset:0;background:#111;padding:20px;z-index:5;overflow:auto'></div><div id=toasts style='position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:9'></div><dialog id="dlg"><form method="dialog" id="dform"></form></dialog>
<script>
const K='hostessMVP';const now=()=>Date.now();
const seed=()=>({cfg:{store:'示範店（測試用）',rooms:'201,202,203,205,206,207,208,209,210,211,VIP1,VIP2',sessionMin:120,tableMin:20,renewMin:20,holdMin:10,breakMin:10,autoFill:'開',pkg1:5000,pkg2:6800,pkgInc:1000,pkgGirls:2,tablePrice:600,privTai:5,privInclDeduct:'是',privLegacy:'否',renewPkg:'是',renewDrink:'是',offDays:5,bonus:5000,noShowCounts:'是',bookedMax:3,freeWithinMin:5,privPrice:1800,privBlockMin:120,busyRotMin:30,visitMin:10,baoRules:'5保2,7保3,9保4,10保5',tagMap:Array.from({length:50},(_,i)=>{const x=String(i+1).padStart(2,'0');return 'TAG'+x+'='+x+'=手環'}).join(',')},
rooms:{},mode:'閒',waiting:0,op:'',decisions:[],att:{},reqs:[],redLog:[],blueLog:[],girls:Array.from({length:50},(_,i)=>String(i+1).padStart(2,'0')).map(x=>({id:x,name:x+' 示範'+x,leave:false,on:false,status:'休息室',room:null,start:0,until:0,src:''})),autos:[],log:[]});
let S=JSON.parse(localStorage.getItem(K)||'null')||seed();
const save=()=>localStorage.setItem(K,JSON.stringify(S));const C=()=>S.cfg;const roomList=()=>C().rooms.split(',').map(s=>s.trim()).filter(Boolean);
const t=ts=>new Date(ts).toLocaleTimeString('zh-TW',{hour12:false});const mmss=ms=>{ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return m+':'+String(s).padStart(2,'0')};
function log(m){S.log.unshift(t(now())+' '+m);S.log=S.log.slice(0,200);save()}
const G=id=>S.girls.find(g=>g.id==id);
function checkIn(r){const rules=C().baoRules.split(',').map(x=>x.trim());const f=document.getElementById('dform');
f.innerHTML=`<h3>${r} 開番（${C().sessionMin} 分）</h3><label>客人人數 <input id=ciN type=number value=2 min=1 style="width:60px"></label><label>套餐酒水 <select id=ciD><option>啤酒一手</option><option>高粱一瓶</option></select></label><label>保檯 <select id=ciB><option value="">不保（套餐 ${C().pkgGirls} 位）</option>${rules.map(x=>`<option>${x}</option>`).join('')}</select></label><button value=ok>開番</button> <button class=s value="">取消</button>`;
const d=document.getElementById('dlg');d.returnValue='';d.onclose=()=>{if(d.returnValue=='ok')doCheckIn(r,+ciN.value,ciD.value,ciB.value)};d.showModal()}
function doCheckIn(r,n,drink,br){const mm=(br||'').match(/(\d+)保(\d+)/);S.rooms[r]={bao:mm?{n:+mm[1],m:+mm[2]}:null,sent:0,guests:n,drink,bans:[[]],start:now(),end:now()+C().sessionMin*60000,sessions:1,warned:false};log(`${r} 開番 ${n} 人，${drink}，保檯 ${br||'不保'}，套餐 ${pkgPrice(n)} 元`);render()}
const pkgPrice=n=>n<=1?C().pkg1:C().pkg2+(n-2)*C().pkgInc;
function bill(x){const items=[],pk=pkgPrice(x.guests),bans=x.bans||[[]],nPk=C().renewPkg=='是'?x.sessions:1;
 items.push([`套餐 ${x.guests} 人 × ${nPk} 番`,pk*nPk]);items.push([`含酒水：${x.drink||'—'} × ${C().renewDrink=='是'?x.sessions:1}`,0]);
 const base=C().pkgGirls,tp=C().tablePrice,legacy=C().privLegacy=='是';bans.forEach((b,i)=>{const pr=(x.privBans||[])[i]||[];let ex=0;
  b.forEach((id,k)=>{const inc=k<base;if(pr.includes(id)&&!legacy){const n=inc&&C().privInclDeduct=='是'?C().privTai-1:C().privTai;items.push([`第 ${i+1} 番 私檯 ${id}號 × ${n} 台 × ${tp}${inc?'（套餐內）':''}`,n*tp])}else if(!inc)ex++});
  if(ex)items.push([`第 ${i+1} 番 加台 ${ex} 台 × ${tp}`,ex*tp])});
 if(legacy){const pv=(x.privTotal||0)+S.girls.filter(g=>g.priv&&g.priv.room==x.id).reduce((a,g)=>a+privCharge(g.priv),0);if(pv)items.push(['私檯（舊制 '+C().privPrice+' 元/段）',pv])}
 return{items,total:items.reduce((a,i)=>a+i[1],0)}}
function renew(r){const x=S.rooms[r];x.end+=C().sessionMin*60000;x.sessions++;(x.bans=x.bans||[[]]).push(S.girls.filter(g=>g.room==r).map(g=>g.id));(x.privBans=x.privBans||[])[x.bans.length-1]=S.girls.filter(g=>g.room==r&&g.priv).map(g=>g.id);x.warned=false;log(`${r} 續番（第 ${x.sessions} 番，+${C().renewPkg=='是'?pkgPrice(x.guests):0} 元）`);render()}
function checkout(r){const x=S.rooms[r];x.id=r;S.girls.filter(g=>g.room==r).forEach(g=>leave(g,'結單'));const b=bill(x);S.autos=S.autos.filter(a=>!a.rooms.includes(r));S.girls.forEach(g=>g.holds=(g.holds||[]).filter(y=>y!=r));S.reqs=S.reqs.filter(q=>q.room!=r);
log(`${r} 結單 ${b.total} 元（${b.items.map(i=>i[0]+' '+i[1]).join('；')}）`);const f=document.getElementById('dform');f.innerHTML=`<h3>${r} 結單明細</h3><table cellpadding=5 style="font-size:16px">${b.items.map(i=>`<tr><td>${i[0]}</td><td align=right>${i[1].toLocaleString()}</td></tr>`).join('')}<tr style="font-weight:bold"><td>合計</td><td align=right>${b.total.toLocaleString()} 元</td></tr></table><button value=ok>完成</button>`;const d=document.getElementById('dlg');d.onclose=null;d.showModal();delete S.rooms[r];render()}
function seat(g,r,src){{const x=S.rooms[r];if(x){x.bans=x.bans||[[]];const b=x.bans[x.bans.length-1];if(!b.includes(g.id))b.push(g.id)}}g.holds=(g.holds||[]).filter(x=>x!=r);if(src=='blue'||src=='red'){S=S;(src=='red'?S.redLog:S.blueLog).unshift({t:now(),girl:g.id,room:r})}if(g.priv)endPriv(g);g.tables=(g.tables||0)+1;if(g.room&&g.room!=r){log(`⚠ 撞檯：${g.name} 已在 ${g.room}，改派 ${r}`);leave(g,'撞檯改派')}if(S.rooms[r])S.rooms[r].sent=(S.rooms[r].sent||0)+1;g.status='在檯';g.room=r;g.start=now();g.until=now()+C().tableMin*60000;g.src=src;g.warned=false;log(`${g.name} → ${r}（${src=='blue'?'藍筆（店家勾選）':src=='red'?'紅筆（客人點檯）':src=='auto'?'同台自動轉':src=='tag'?'手環感應':src=='fill'?'系統自動補人':'派檯'}）`)}
function leave(g,why){if(g.priv)endPriv(g);if(g.room)log(`${g.name} 離開 ${g.room}（${why}）`);g.status='休息';g.room=null;g.until=now()+C().breakMin*60000;g.src=''}
function assign(r){const free=S.girls.filter(g=>g.on&&g.room!=r);if(!free.length)return alert('沒有可派的女孩（請先上班打卡）');
const f=document.getElementById('dform');f.innerHTML=`<h3>藍筆（店家勾選）→ ${r}</h3>`+free.map(g=>`<button value="${g.id}">${g.name}（${g.status}${g.room?' '+g.room+' ⚠撞檯':''}）</button> `).join('')+'<p><label><input type=checkbox id=holdOnly> 只保檯（保留，不入房）</label><label><input type=checkbox id=priv> 私檯（'+C().privPrice+' 元 / '+C().privBlockMin+' 分）</label><button class="s" value="">取消</button></p>';
const d=document.getElementById('dlg');d.onclose=()=>{if(d.returnValue){const gg=G(d.returnValue);const bk=bookedRooms(gg,r);if(bk.length>=C().bookedMax&&!confirm(`⚠ ${gg.name} 已點滿 ${bk.length} 間（${bk.join('、')}），仍要派往 ${r}？`)){log(`⚠ 點滿警示：${gg.name} 派往 ${r} 已取消`);return}if(document.getElementById('holdOnly').checked){hold(gg.id,r);return}if(gg.room&&!confirm(gg.name+' 已在 '+gg.room+'，確定撞檯改派？'))return;seat(gg,r,'blue');log(`【藍筆】店家勾選 ${gg.name} → ${r}`);if(document.getElementById('priv').checked)setPriv(gg);render()}};d.returnValue='';d.showModal()}
function clock(id){const g=G(id);g.on=!g.on;g.leave=false;todayRec(g);if(g.on){g.status='休息室';g.idleSince=now();log(g.name+' 上班打卡')}else{if(g.room)leave(g,'下班');g.status='休息室';S.autos.forEach(a=>a.girls=a.girls.filter(x=>x!=id));log(g.name+' 下班打卡')}render()}
function openAuto(){const busy=Object.keys(S.rooms);const girls=S.girls.filter(g=>g.on);if(busy.length<2||girls.length<2)return alert('需要至少 2 間有客包廂與 2 位上班女孩');
const f=document.getElementById('dform');f.innerHTML='<h3>同台互轉（最多 3 人 / 3 間，環狀 A→B→C→A）</h3><p>包廂：'+busy.map(r=>`<label style="display:inline"><input type=checkbox name=r value="${r}">${r}</label> `).join('')+'</p><p>女孩（依序）：'+girls.map(g=>`<label style="display:inline"><input type=checkbox name=g value="${g.id}">${g.name}</label> `).join('')+'</p><button value="ok">開啟 auto</button> <button class="s" value="">取消</button>';
const d=document.getElementById('dlg');d.returnValue='';d.onclose=()=>{if(d.returnValue!='ok')return;const rs=[...f.querySelectorAll('[name=r]:checked')].map(x=>x.value),gs=[...f.querySelectorAll('[name=g]:checked')].map(x=>x.value);
if(rs.length<2||rs.length>3||gs.length!=rs.length)return alert('請選 2–3 間包廂，且女孩人數等於包廂數');startAuto(rs,gs)};d.showModal()}
function startAuto(rs,gs){S.girls.filter(g=>gs.includes(g.id)&&g.room).forEach(g=>leave(g,'加入同台'));gs.forEach((id,i)=>seat(G(id),rs[i],'auto'));S.autos.push({rooms:rs,girls:gs});log(`開啟同台互轉：${rs.join('→')}，${gs.map(x=>G(x).name).join('、')}`);render()}
function rotate(a){const moves=a.girls.map(id=>{const g=G(id);return [g,a.rooms[(a.rooms.indexOf(g.room)+1)%a.rooms.length]]});moves.forEach(([g,r])=>{log(`${g.name} 離開 ${g.room}（自動轉檯）`);g.room=null;seat(g,r,'auto')});log('同台互轉完成一輪移動')}
function toast(m,warn){const d=document.createElement('div');d.textContent=m;d.style.cssText='padding:10px 18px;margin:4px;border-radius:8px;font-size:18px;background:'+(warn?'#c33':'#2a8');document.getElementById('toasts').append(d);setTimeout(()=>d.remove(),4000);log((warn?'⚠ ':'📡 ')+m)}
const tagToGirl=tag=>{const e=C().tagMap.split(',').map(x=>x.trim().split('=')).find(([k])=>k==tag);return e&&G(e[1])};
// 唯一入口：日後真實讀卡器（WebSocket 推播）也呼叫此函式
function handleDoorEvent(ev){const g=tagToGirl(ev.tagId),r=ev.roomId;if(!g){toast(`未知標籤 ${ev.tagId} 於 ${r}`,true);return}
let dir=ev.direction||(g.room==r?'out':'in');const num=g.id+'號';
if(dir=='in'){if(g.room==r){toast(`${num} 已在 ${r}（重複讀取）`);return}
 if(!g.on){g.on=true;g.leave=false;todayRec(g);log(g.name+' 感應自動上班')}
 if(!S.rooms[r])toast(`${num} 進入空房 ${r}`,true);
 else if(!g.room&&g.status!='在檯'&&!g.pending)toast(`${num} 進入 ${r}（未經派檯）`,true);
 if(g.room)toast(`撞檯：${num} 仍登記在 ${g.room}，現進入 ${r}`,true);
 seat(g,r,'tag');toast(`${num} 進入 ${r}（${(C().tagMap.split(',').map(x=>x.trim().split('=')).find(([k])=>k==ev.tagId)||[])[2]||'手環'}）`)}
else{if(g.room!=r)toast(`${num} 離開 ${r}，但登記在 ${g.room||'無'}`,true);else{leave(g,'感應離開');toast(`${num} 離開 ${r}`)}}
render()}
function openSettings(){const c=C();const f=document.getElementById('dform');f.innerHTML='<h3>店家設定</h3>'+[['store','店名','text'],['rooms','包廂清單（逗號分隔）','text'],['sessionMin','一節長度（分）','number'],['tableMin','每檯時間（分）','number'],['renewMin','續番提醒（剩幾分）','number'],['holdMin','保檯保留時間（分，規則待確認）','number'],['breakMin','休息時間（分）','number'],['tagMap','標籤對應（標籤=編號=裝置類型，預設手環，逗號分隔）','text'],['privTai','私檯台數（原 1 台＋私檯 4 台）','number'],['privInclDeduct','套餐內小姐私檯只加 4 台（是/否，待確認）','text'],['privLegacy','使用舊制私檯固定價（是/否）','text'],['privPrice','舊制私檯價格（元/段）','number'],['privBlockMin','私檯計費段（分）','number'],['busyRotMin','忙時私檯轉檯間隔（分）','number'],['visitMin','訪客時間（分）','number'],['pkg1','套餐 1 人價','number'],['pkg2','套餐 2 人價','number'],['pkgInc','每多 1 人加價','number'],['pkgGirls','套餐含小姐數（不保）','number'],['tablePrice','每台價格','number'],['renewPkg','續番再收套餐（是/否，待確認）','text'],['renewDrink','續番再含酒水（是/否，待確認）','text'],['offDays','每月可休天數','number'],['bonus','全勤獎金（元）','number'],['noShowCounts','未到是否計入休假（是/否，待確認）','text'],['bookedMax','點滿：同時被點包廂數上限','number'],['freeWithinMin','幾分鐘內會空出仍可點（待確認）','number'],['autoFill','保檯不足自動補人（開/關）','text'],['baoRules','保檯規則預設（N保M：送進N位、保留M位）','text']].map(([k,l,ty])=>`<label>${l}<br><input name="${k}" type="${ty}" value="${c[k]}" size=40 style="max-width:100%"></label>`).join('')+'<button value="ok">儲存</button> <button class="s" value="">取消</button>';
const d=document.getElementById('dlg');d.returnValue='';d.onclose=()=>{if(d.returnValue!='ok')return;f.querySelectorAll('input').forEach(i=>c[i.name]=i.type=='number'?+i.value:i.value);log('店家設定已更新');render()};d.showModal()}
function setPriv(g){{const x=S.rooms[g.room];if(x){x.privBans=x.privBans||[];const i=(x.bans||[[]]).length-1;x.privBans[i]=x.privBans[i]||[];if(!x.privBans[i].includes(g.id))x.privBans[i].push(g.id)}}g.priv={room:g.room,start:now(),nextRot:now()+C().busyRotMin*60000,visiting:false};log(`${g.name} 於 ${g.room} 設為私檯`)}
const privCharge=p=>Math.max(1,Math.ceil((now()-p.start)/(C().privBlockMin*60000)))*C().privPrice;
function endPriv(g){const p=g.priv;g.priv=null;const x=S.rooms[p.room];const c=privCharge(p);if(x&&C().privLegacy=='是')x.privTotal=(x.privTotal||0)+c;log(`${g.name} 私檯結束（${p.room}）`)}
const roomRotates=r=>{const o=S.rooms[r]&&S.rooms[r].rot;return o=='可轉'||(o!='不可轉'&&S.mode=='忙')};
function setRot(r){const x=S.rooms[r];x.rot=x.rot=='可轉'?'不可轉':x.rot=='不可轉'?null:'可轉';log(`${r} 私檯設定 → ${x.rot||'依忙閒模式'}（${S.op||'未填幹部'}）`);render()}
function signals(){const rl=roomList(),occ=Object.keys(S.rooms).length/rl.length,free=S.girls.filter(g=>g.on&&!g.leave&&g.status=='休息室').length;return{occ:Math.round(occ*100),waiting:S.waiting||0,free}}
function suggest(){const s=signals(),why=[];if(s.occ>=70)why.push(`包廂使用率 ${s.occ}% ≥70%`);if(s.waiting>0)why.push(`有 ${s.waiting} 組客人等候`);if(s.free<5)why.push(`休息室僅 ${s.free} 人`);return{mode:why.length?'忙':'閒',why:why.length?why.join('、'):`使用率 ${s.occ}%、無等候、休息室 ${s.free} 人`}}
function setMode(m){const sg=suggest(),d=new Date();S.mode=m;S.decisions.push({type:'忙閒',time:d.toISOString(),weekday:d.getDay(),hour:d.getHours(),mode:m,suggested:sg.mode,signals:signals(),by:S.op||'未填'});log(`忙閒模式 → ${m}（${S.op||'未填幹部'}；系統建議 ${sg.mode}；${sg.why}）`);render()}
function privTick(n){S.girls.forEach(g=>{const p=g.priv;if(!p)return;if(p.visiting){if(n>=p.visitEnd){p.visiting=false;p.nextRot=n+C().busyRotMin*60000;toast(`${g.id}號 請回 ${p.room}（私檯）`)}return}
 if(roomRotates(p.room)&&n>=p.nextRot){p.visiting=true;p.visitEnd=n+C().visitMin*60000;toast(`私檯 ${g.id}號 請出 ${p.room} 轉檯訪客（${C().visitMin} 分後回房）`,true)}else if(!roomRotates(p.room))p.nextRot=Math.max(p.nextRot,n)})}
const dkey=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function todayRec(g){const k=dkey(now());S.att[k]=S.att[k]||{};if(g.on||S.att[k][g.id]=='上班')S.att[k][g.id]='上班';else if(g.leave)S.att[k][g.id]='請假';else delete S.att[k][g.id]}
function monthStats(id){const mk=dkey(now()).slice(0,7),today=dkey(now());let work=0,leave=0,noshow=0;
 for(const k in S.att){if(!k.startsWith(mk))continue;const v=S.att[k][id];if(v=='上班')work++;else if(v=='請假')leave++;else if(k<today)noshow++}
 const off=leave+(C().noShowCounts=='是'?noshow:0);return{work,leave,noshow,off,full:off<=C().offDays}}
function reportRows(){return S.girls.map(g=>{const m=monthStats(g.id);return[g.id,g.name,m.work,m.leave,m.noshow,m.off,m.full?'是':'否',m.full?C().bonus:0]})}
function openReport(){const h=['編號','名字','上班天數','請假','未到','計休天數','全勤','全勤獎金'];const f=document.getElementById('dform');
 f.innerHTML=`<h3>${dkey(now()).slice(0,7)} 月出勤報表（可休 ${C().offDays} 天；未到${C().noShowCounts=='是'?'計入':'不計入'}休假）</h3><div style="max-height:60vh;overflow:auto"><table border=1 cellpadding=4 style="border-collapse:collapse;font-size:14px"><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${reportRows().map(r=>`<tr style="${r[6]=='否'?'color:#f77':''}">${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div><p><button type=button id=csvBtn onclick="exportCSV()">匯出 CSV</button> <button class=s value="">關閉</button></p>`;
 const d=document.getElementById('dlg');d.onclose=null;d.showModal()}
function exportCSV(){const h='編號,名字,上班天數,請假,未到,計休天數,全勤,全勤獎金\n';const b=new Blob(['\ufeff'+h+reportRows().map(r=>r.join(',')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='出勤報表-'+dkey(now()).slice(0,7)+'.csv';a.click()}
function bookedRooms(g,except){return[...new Set([g.room,g.priv&&g.priv.room,...(g.holds||[]),...S.reqs.filter(q=>q.girl==g.id).map(q=>q.room)].filter(x=>x&&x!=except))]}
function hold(id,r){const g=G(id);g.holds=[...new Set([...(g.holds||[]),r])];log(`${g.name} 保檯中：${r}`);render()}
function unhold(id,r){const g=G(id);g.holds=(g.holds||[]).filter(x=>x!=r);log(`${g.name} 取消保檯：${r}`);render()}
function guestState(g){if(!g.on||g.leave)return'hide';if(g.gov=='pause')return'grey';if(g.gov=='open')return'lit';const busyRooms=bookedRooms(g).length;if(g.status=='休息'&&g.until-now()>C().freeWithinMin*60000)return'grey';
 if(busyRooms>=C().bookedMax)return'grey';return'lit'}
let guestRoom=null;
function openGuest(){const occ=Object.keys(S.rooms);if(!occ.length)return alert('沒有有客的包廂');guestRoom=guestRoom&&S.rooms[guestRoom]?guestRoom:occ[0];renderGuest();document.getElementById('guest').style.display='block'}
function renderGuest(){const el=document.getElementById('guest');el.innerHTML=`<div style="display:flex;gap:10px;align-items:center"><h2 style="margin:0">包廂 <select onchange="guestRoom=this.value;renderGuest()">${Object.keys(S.rooms).map(r=>`<option ${r==guestRoom?'selected':''}>${r}</option>`).join('')}</select> 點檯</h2><span>亮燈＝可點・灰色＝目前不可點</span><button class=s onclick="document.getElementById('guest').style.display='none'">關閉（模擬結束）</button></div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px">`+
 S.girls.map(g=>[g,guestState(g)]).filter(([,st])=>st!='hide').map(([g,st])=>`<div class="gt ${st}" data-id="${g.id}" onclick="${st=='lit'?`guestPick('${g.id}')`:''}" style="padding:14px;border-radius:10px;text-align:center;font-size:18px;${st=='lit'?'background:#fd5;color:#222;box-shadow:0 0 12px #fd5;cursor:pointer':'background:#444;color:#888'}">${g.name}</div>`).join('')+'</div>'}
function decide(type,g,choice,extra){const d=new Date(),sg=signals();S.decisions.push(Object.assign({type,time:d.toISOString(),weekday:d.getDay(),hour:d.getHours(),girl:g.id,choice,by:S.op||'未填',signals:{girlRooms:g.room?1:0,girlTables:g.tables||0,mode:S.mode,occ:sg.occ,waiting:sg.waiting,free:sg.free}},extra||{}));save()}
function setGov(id,v){const g=G(id);const reason=v?prompt('原因（可空白）',''):'';g.gov=v||null;decide('點檯可用性',g,v||'auto',{reason:reason||''});log(`幹部 ${S.op||'未填'}：${g.name} ${v=='pause'?'暫停點檯':v=='open'?'開放點檯':'恢復自動'}${reason?'（'+reason+'）':''}`);render()}
function guestPick(id){S.reqs.push({id:now()+id,room:guestRoom,girl:id,t:now()});toast(`紅筆點檯請求：${guestRoom} 點 ${id}號`);renderGuest();render()}
function reqDo(i,ok){const q=S.reqs.splice(i,1)[0],g=G(q.girl);decide('紅筆請求',g,ok?'accept':'decline',{room:q.room});if(ok){if(g.room&&g.room!=q.room&&!confirm(`${g.name} 已在 ${g.room}，確定撞檯改派？`)){S.reqs.splice(i,0,q);return}seat(g,q.room,'red');log(`【紅筆】${q.room} 客人點 ${g.name}，控台確認`)}else toast(`已通知 ${q.room}：${g.id}號 目前無法前往`,true);render()}
function autoFill(){if(C().autoFill!='開')return;for(const r in S.rooms){const x=S.rooms[r];if(!x.bao||x.autoOff)continue;
 while(S.girls.filter(g=>g.room==r).length<x.bao.m){const c=S.girls.filter(g=>g.on&&!g.leave&&g.status=='休息室'&&g.room!=r).sort((a,b)=>(a.tables||0)-(b.tables||0)||(a.idleSince||0)-(b.idleSince||0))[0];
  if(!c){if(!x.noneWarned){x.noneWarned=true;toast(`${r} 保檯不足，無可補人員`,true)}break}
  x.noneWarned=false;const before=c.tables||0;seat(c,r,'fill');x.lastAuto=c.id;toast(`系統自動補人：${c.id}號 → ${r}（今日 ${before} 檯）`)}}}
function undoFill(r){const x=S.rooms[r],g=G(x.lastAuto);if(g&&g.room==r){leave(g,'控台撤銷補人');g.tables=Math.max(0,g.tables-1);g.status='休息室';g.idleSince=now()}x.lastAuto=null;x.autoOff=true;log(`${r} 撤銷自動補人，此房自動補人暫停`);render()}
function tick(){const n=now();autoFill();privTick(n);for(const r in S.rooms){const x=S.rooms[r];if(!x.warned&&x.end-n<=C().renewMin*60000){x.warned=true;log(`⚠ ${r} 剩 ${C().renewMin} 分，請詢問續番`)}}
S.autos.forEach(a=>{if(a.girls.length&&a.girls.every(id=>G(id).until<=n))rotate(a)});
S.girls.forEach(g=>{if(g.status=='在檯'&&!g.priv&&!g.warned&&g.until<=n&&!S.autos.some(a=>a.girls.includes(g.id))){g.warned=true;log(`⚠ ${g.name} 在 ${g.room} 已到時間，請轉檯`)}if(g.status=='休息'&&g.until<=n){g.status='休息室';g.idleSince=n;log(g.name+' 休息結束，回休息室')}});save();render()}
function render(){const n=now();document.getElementById('store').textContent=C().store+' 排檯看板';document.getElementById('clock').textContent=t(n);const mb=document.getElementById('modeBtn');mb.textContent='忙閒：'+S.mode;mb.style.background=S.mode=='忙'?'#c33':'#2a8';const sg=suggest();document.getElementById('sugg').textContent=`系統建議：${sg.mode}（${sg.why}）・已記錄 ${S.decisions.length} 筆決策`;
document.getElementById('rooms').innerHTML=roomList().map(r=>{const x=S.rooms[r];const gs=S.girls.filter(g=>g.room==r);if(!x)return`<div class=room><h3>${r}</h3><div>空房</div><button onclick="checkIn('${r}')">進客</button></div>`;
const left=x.end-n,soon=left<=C().renewMin*60000;const short=x.bao&&gs.length<x.bao.m;const bt=x.bao?`<div class="g ${short?'alert':''}">保檯 ${x.bao.n}保${x.bao.m}：已送 ${x.sent||0}/${x.bao.n}・在房 ${gs.length}/${x.bao.m}${short?' ⚠不足':''}</div>`:'';return`<div class="room busy ${soon?'soon':''}"><h3>${r} ${soon?'⚠續番':''}</h3><div>${x.guests} 人・第 ${x.sessions} 節・剩 ${mmss(left)}</div><div style='font-size:14px;color:#fd5'>${x.drink||''}・帳 $${(x.id=r,bill(x).total).toLocaleString()}</div><div style='font-size:13px'>私檯累計 $${(x.privTotal||0)+gs.filter(g=>g.priv).reduce((a,g)=>a+privCharge(g.priv),0)}・<a href=# style='color:#fc6' onclick="setRot('${r}');return false">${x.rot||'依忙閒'}</a></div>`+bt+gs.map(g=>`<div class="g ${g.src} ${!g.priv&&g.until<=n?'alert':''}">${g.src=='red'?'<span class=pen style=background:#c33>紅筆</span>':g.src=='blue'?'<span class=pen style=background:#36c>藍筆</span>':''}${g.name} ${g.priv?`<b style='background:#c39;padding:0 4px;border-radius:3px'>私檯</b> ${mmss(C().privBlockMin*60000-(n-g.priv.start)%(C().privBlockMin*60000))} ${C().privLegacy=='是'?'$'+privCharge(g.priv):C().privTai+'台'}${g.priv.visiting?' 訪客中':''}`:mmss(g.until-n)}</div>`).join('')+`<button onclick="assign('${r}')">派檯</button> <button class=s onclick="renew('${r}')">續番</button> <button class=s onclick="checkout('${r}')">結單</button>${x.lastAuto?` <button class=s onclick="undoFill('${r}')">撤銷補人</button>`:''}${x.autoOff?` <button class=s onclick="S.rooms['${r}'].autoOff=false;log('${r} 恢復自動補人');render()">恢復自動補人</button>`:''}</div>`}).join('');
const st=g=>g.leave?'請假':g.on?g.status:'未到';const q=document.getElementById('q').value.trim(),fl=document.getElementById('fl').value;document.getElementById('cnt').textContent=` 上班 ${S.girls.filter(g=>g.on).length}/${S.girls.length}・在檯 ${S.girls.filter(g=>g.room).length}`;
document.getElementById('girls').innerHTML=S.girls.filter(g=>(!q||g.name.includes(q))&&(!fl||st(g)==fl)).map(g=>`<div class=g style='font-size:13px'>${g.name}・今日 ${g.tables||0} 檯<br>${(m=>`<span style='${m.off>=C().offDays?'color:#f66;font-weight:bold':''}'>本月休 ${m.off}/${C().offDays}・全勤${m.full?'保持中':'已失去'}</span>`)(monthStats(g.id))}<br>${st(g)}${g.room?' '+g.room:''}${(g.holds||[]).length?' 保:'+g.holds.join(','):''}${g.status=='休息'&&g.on?' '+mmss(g.until-n):''}<br>${g.on?`<select style='font-size:11px' onchange="setGov('${g.id}',this.value)"><option value='' ${!g.gov?'selected':''}>點檯:自動</option><option value=pause ${g.gov=='pause'?'selected':''}>暫停點檯</option><option value=open ${g.gov=='open'?'selected':''}>開放點檯</option></select> `:''}<button class=s style='padding:3px 6px;font-size:12px' onclick="clock('${g.id}')">${g.on?'下班':'上班'}</button>${g.on?'':` <button class=s style='padding:3px 6px;font-size:12px' onclick="G('${g.id}').leave=!G('${g.id}').leave;todayRec(G('${g.id}'));log(G('${g.id}').name+(G('${g.id}').leave?' 登記請假':' 取消請假'));render()">請假</button>`}</div>`).join('');
document.getElementById('autos').innerHTML=S.autos.map((a,i)=>`<div class=h><span>${a.rooms.join('→')}：${a.girls.map(x=>G(x).name).join('、')}</span><button class=s onclick="S.autos.splice(${i},1);log('關閉同台互轉');render()">關閉</button></div>`).join('')||'無';
const sr=document.getElementById('sr');if(sr.options.length!=roomList().length)sr.innerHTML=roomList().map(r=>`<option>${r}</option>`).join('');document.getElementById('reqs').innerHTML=S.reqs.map((q,i)=>`<div class=h><span>${t(q.t)} ${q.room} 客人點 ${G(q.girl).name}</span><span><button onclick="reqDo(${i},true)">確認派檯</button> <button class=s onclick="reqDo(${i},false)">婉拒</button></span></div>`).join('')||'無';if(document.getElementById('guest').style.display=='block')renderGuest();document.getElementById('log').innerHTML=S.log.map(l=>`<div>${l}</div>`).join('')}
if(!S.log.length){S.girls.slice(0,45).forEach((g,i)=>{g.on=true;g.idleSince=now()-(45-i)*60000;g.tables=i%3});S.girls[47].leave=true;{const d0=new Date(now());for(let day=1;day<d0.getDate();day++){const k=dkey(new Date(d0.getFullYear(),d0.getMonth(),day));S.att[k]={};S.girls.forEach((g,i)=>{const v=(i*7+day*3)%11;S.att[k][g.id]=(i==2&&day<=6)?'請假':v==0?'請假':(v==5&&i%4==0)?'未到x':'上班';if(S.att[k][g.id]=='未到x')delete S.att[k][g.id]})}}S.girls.forEach(todayRec);S.rooms['201']={drink:'啤酒一手',bans:[[]],bao:{n:5,m:2},sent:0,guests:3,start:now()-100*60000,end:now()+15*60000,sessions:1,warned:false};S.rooms['202']={drink:'高粱一瓶',bans:[[]],bao:{n:7,m:3},sent:0,guests:2,start:now(),end:now()+120*60000,sessions:1,warned:false};seat(G('01'),'201','blue');log('載入示範資料')}
document.getElementById('op').value=S.op||'';document.getElementById('wait').value=S.waiting||0;render();setInterval(tick,1000);
</script></body></html>
