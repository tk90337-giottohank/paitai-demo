<!DOCTYPE html><html lang="zh-Hant"><head>
<meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>排檯系統原型</title><style>
body{font-family:sans-serif;margin:0;background:#1b1d24;color:#eee}header{padding:10px 16px;background:#2a2d38;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:20px;margin:0 10px 0 0}button{font-size:15px;padding:8px 12px;border:0;border-radius:6px;background:#3d6df2;color:#fff;cursor:pointer}button.s{background:#555}
main{display:grid;grid-template-columns:2fr 1fr;gap:12px;padding:12px}#rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.room{background:#2f3340;border-radius:10px;padding:10px;min-height:120px;border:3px solid #444}.room.busy{border-color:#3c9}.room.soon{border-color:#f33;animation:b 1s infinite}
@keyframes b{50%{background:#5a2020}}.room h3{margin:0 0 4px}.g{background:#444;border-radius:5px;padding:3px 6px;margin:3px 0;font-size:14px}.red{border-left:4px solid #f44}.pen{font-size:11px;padding:0 3px;border-radius:3px;margin-right:3px}.fill{border-left:4px solid #3c9}.tag{border-left:4px solid #fc3}.g.alert{background:#c60}.blue{border-left:4px solid #49f}.auto{border-left:4px solid #c5f}
section{background:#262933;border-radius:10px;padding:10px;margin-bottom:12px}.h{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #333}
#log{max-height:220px;overflow:auto;font-size:13px}dialog{background:#2a2d38;color:#eee;border-radius:10px;border:0}label{display:block;margin:6px 0}input,select{font-size:15px;padding:4px}
@media (max-width:700px){main{grid-template-columns:1fr;padding:6px}#rooms{grid-template-columns:1fr 1fr;gap:6px}
header{gap:6px;padding:8px}h1{font-size:16px;width:100%}header button,header label{flex:1 1 45%;min-height:44px}header input{width:60px}
button,select{min-height:44px}.room{min-width:0;padding:8px}.room button{padding:6px 8px}
#girls{grid-template-columns:1fr!important;max-height:50vh!important}dialog{width:100vw;max-width:100vw;height:100vh;max-height:100vh;margin:0;box-sizing:border-box;overflow:auto}
dialog input[type=text]{width:100%;box-sizing:border-box}#sugg{width:100%}#guest>div:first-child,#qsec .h{flex-wrap:wrap;gap:4px}table{font-size:12px!important}}
#toasts{pointer-events:none}#toasts div:nth-last-child(n+4){display:none}@media (max-width:700px){#toasts{top:auto!important;bottom:8px;width:92%}#toasts div{font-size:14px!important;padding:6px 10px!important}}body{overflow-x:hidden}*{box-sizing:border-box}
.call{border-radius:10px;padding:8px 12px;margin:4px 0;color:#fff}.call .cl{font-size:28px;font-weight:bold}.call .cs{font-size:13px}.call.over{outline:4px solid #ff0;animation:b 1s infinite}.calls{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.lb a{font-size:11px;margin-left:4px;color:#9cf;cursor:pointer;text-decoration:underline}
#board .bh{display:flex;justify-content:space-between;align-items:center;font-size:3vw;color:#fff;margin-bottom:10px}#board .bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32vw,1fr));gap:12px}#board .call .cl{font-size:6vw;line-height:1.1}#board .call .cs{font-size:1.8vw}
#board .bbill{font-size:4vw;color:#fff;background:#c33;padding:6px 14px;border-radius:10px;margin-bottom:10px;font-weight:bold;animation:b 1s infinite}#board .brooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:16px}#board .br{border:3px solid #333;border-radius:8px;padding:6px;font-size:20px;color:#ccc;text-align:center}
@media (max-width:700px){#board .bgrid{grid-template-columns:1fr}#board .call .cl{font-size:40px}#board .call .cs{font-size:14px}#board .bh{font-size:20px}#board .bbill{font-size:24px}}
</style></head><body>
<header><h1 id="store"></h1><span id="clock"></span><button onclick="openSettings()">⚙ 店家設定</button><label style="margin:0">操作幹部 <input id=op size=5 oninput="S.op=this.value;save()"></label><button id=modeBtn onclick="setMode(S.mode=='忙'?'閒':'忙')"></button><span id=sugg style="font-size:13px;color:#fc6"></span><button class="s" onclick="openGuest()">客人點檯（包廂平板）</button><button class="s" onclick="openReport()">月出勤報表</button><button class="s" onclick="openRevenue()">今日營收</button><button class="s" onclick="openExt()">外找</button><button onclick="openBoard()" style="background:#a3c">📺 控台大螢幕</button><button class="s" onclick="openAuto()">同台互轉 auto</button><button class="s" onclick="if(confirm('重設示範資料？')){localStorage.removeItem(K);location.reload()}">重設</button></header>
<main><div><section id=callsec></section><section id=qsec></section><div id="rooms"></div></div><div>
<section><b>紅筆點檯請求</b><div id=reqs></div></section><section><b>女孩名冊（示範資料）</b><span id=cnt></span><br><input id=q placeholder='搜尋編號/名字' oninput=render() size=12> <select id=fl onchange=render()><option value=''>全部</option><option>休息室</option><option>在檯</option><option>休息</option><option>未到</option><option>請假</option></select><div id="girls" style='max-height:340px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:4px'></div></section>
<section><b>模擬感應（門口讀卡器）</b><br>包廂 <select id=sr></select><select id=sa><option value=''>（包廂門）</option><option value=R-LOUNGE>休息室讀卡器</option><option value=R-DINE>餐廳讀卡器</option></select> 標籤 <input id=stag value="TAG08" size=7> <select id=sd><option value=in>進</option><option value=out>出</option><option value="">未知</option></select> <button onclick="handleDoorEvent({readerId:sa.value||'R-'+sr.value,roomId:sr.value,tagId:stag.value.trim(),timestamp:Date.now(),direction:sd.value||null})">送出感應</button></section>
<section><b>同台群組</b><div id="autos"></div></section>
<section><b>事件紀錄</b><div id="log"></div></section></div></main>
<div id=board style='display:none;position:fixed;inset:0;background:#000;z-index:6;overflow:auto;padding:16px'></div><div id=guest style='display:none;position:fixed;inset:0;background:#111;padding:20px;z-index:5;overflow:auto'></div><div id=toasts style='position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:9'></div><dialog id="dlg"><form method="dialog" id="dform"></form></dialog>
<script>
const K='hostessMVP';const now=()=>Date.now();
const seed=()=>({cfg:{store:'示範店（測試用）',rooms:'201,202,203,205,206,207,208,209,210,211,VIP1,VIP2',sessionMin:120,tableMin:20,renewMin:20,holdMin:10,breakMin:10,autoFill:'開',pkg1:5000,pkg2:6800,pkgInc:1000,pkgGirls:2,tablePrice:600,privTai:5,privInclDeduct:'是',privLegacy:'否',renewPkg:'是',renewDrink:'是',offDays:5,bonus:5000,noShowCounts:'是',bookedMax:3,freeWithinMin:5,privPrice:1800,privBlockMin:120,busyRotMin:30,visitMin:10,baoRules:'5保2,7保3,9保4,10保5',tagMap:Array.from({length:50},(_,i)=>{const x=String(i+1).padStart(2,'0');return 'TAG'+x+'='+x+'=手環'}).join(',')},
rooms:{},mode:'閒',waiting:0,op:'',decisions:[],att:{},reqs:[],redLog:[],blueLog:[],girls:Array.from({length:50},(_,i)=>String(i+1).padStart(2,'0')).map(x=>({id:x,name:x+' 示範'+x,leave:false,on:false,status:'休息室',room:null,start:0,until:0,src:''})),autos:[],log:[]});
let S=JSON.parse(localStorage.getItem(K)||'null')||seed();
const save=()=>localStorage.setItem(K,JSON.stringify(S));const C=()=>S.cfg;const roomList=()=>C().rooms.split(',').map(s=>s.trim()).filter(Boolean);
const t=ts=>new Date(ts).toLocaleTimeString('zh-TW',{hour12:false});const mmss=ms=>{ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return m+':'+String(s).padStart(2,'0')};
function log(m){S.log.unshift(t(now())+' '+m);S.log=S.log.slice(0,200);save()}
const G=id=>S.girls.find(g=>g.id==id);
function checkIn0(r){const rules=C().baoRules.split(',').map(x=>x.trim());const f=document.getElementById('dform');
f.innerHTML=`<h3>${r} 開番（${C().sessionMin} 分）</h3><label>客人人數 <input id=ciN type=number value=2 min=1 style="width:60px"></label><label>套餐酒水 <select id=ciD><option>啤酒一手</option><option>高粱一瓶</option></select></label><label>保檯 <select id=ciB><option value="">不保（套餐 ${C().pkgGirls} 位）</option>${rules.map(x=>`<option>${x}</option>`).join('')}</select></label><button value=ok>開番</button> <button class=s value="">取消</button>`;
const d=document.getElementById('dlg');d.returnValue='';d.onclose=()=>{if(d.returnValue=='ok')doCheckIn(r,+ciN.value,ciD.value,ciB.value)};d.showModal()}
function doCheckIn0(r,n,drink,br){const mm=(br||'').match(/(\d+)保(\d+)/);S.rooms[r]={bao:mm?{n:+mm[1],m:+mm[2]}:null,sent:0,guests:n,drink,bans:[[]],start:now(),end:now()+C().sessionMin*60000,sessions:1,warned:false};log(`${r} 開番 ${n} 人，${drink}，保檯 ${br||'不保'}，套餐 ${pkgPrice(n)} 元`);render()}
const pkgPrice=n=>n<=1?C().pkg1:C().pkg2+(n-2)*C().pkgInc;
function bill0(x){const items=[],pk=pkgPrice(x.guests),bans=x.bans||[[]],nPk=C().renewPkg=='是'?x.sessions:1;
 items.push([`套餐 ${x.guests} 人 × ${nPk} 番`,pk*nPk]);items.push([`含酒水：${x.drink||'—'} × ${C().renewDrink=='是'?x.sessions:1}`,0]);
 const base=C().pkgGirls,tp=C().tablePrice,legacy=C().privLegacy=='是';bans.forEach((b,i)=>{const pr=(x.privBans||[])[i]||[];let ex=0;
  b.forEach((id,k)=>{const inc=k<base;if(pr.includes(id)&&!legacy){const n=inc&&C().privInclDeduct=='是'?C().privTai-1:C().privTai;items.push([`第 ${i+1} 番 私檯 ${id}號 × ${n} 台 × ${tp}${inc?'（套餐內）':''}`,n*tp])}else if(!inc)ex++});
  if(ex)items.push([`第 ${i+1} 番 加台 ${ex} 台 × ${tp}`,ex*tp])});
 if(legacy){const pv=(x.privTotal||0)+S.girls.filter(g=>g.priv&&g.priv.room==x.id).reduce((a,g)=>a+privCharge(g.priv),0);if(pv)items.push(['私檯（舊制 '+C().privPrice+' 元/段）',pv])}
 return{items,total:items.reduce((a,i)=>a+i[1],0)}}
function renew0(r){const x=S.rooms[r];x.end+=C().sessionMin*60000;x.sessions++;(x.bans=x.bans||[[]]).push(S.girls.filter(g=>g.room==r).map(g=>g.id));(x.privBans=x.privBans||[])[x.bans.length-1]=S.girls.filter(g=>g.room==r&&g.priv).map(g=>g.id);x.warned=false;log(`${r} 續番（第 ${x.sessions} 番，+${C().renewPkg=='是'?pkgPrice(x.guests):0} 元）`);render()}
function checkout(r){const x=S.rooms[r];x.id=r;S.girls.filter(g=>g.room==r).forEach(g=>leave(g,'結單'));const b=bill(x);S.autos=S.autos.filter(a=>!a.rooms.includes(r));S.girls.forEach(g=>g.holds=(g.holds||[]).filter(y=>y!=r));S.reqs=S.reqs.filter(q=>q.room!=r);
log(`${r} 結單 ${b.total} 元（${b.items.map(i=>i[0]+' '+i[1]).join('；')}）`);const f=document.getElementById('dform');f.innerHTML=`<h3>${r} 結單明細</h3><table cellpadding=5 style="font-size:16px">${b.items.map(i=>`<tr><td>${i[0]}</td><td align=right>${i[1].toLocaleString()}</td></tr>`).join('')}<tr style="font-weight:bold"><td>合計</td><td align=right>${b.total.toLocaleString()} 元</td></tr></table><button value=ok>完成</button>`;const d=document.getElementById('dlg');d.onclose=null;d.showModal();delete S.rooms[r];render()}
function seat0(g,r,src){{const x=S.rooms[r];if(x){x.bans=x.bans||[[]];const b=x.bans[x.bans.length-1];if(!b.includes(g.id))b.push(g.id)}}g.holds=(g.holds||[]).filter(x=>x!=r);if(src=='blue'||src=='red'){S=S;(src=='red'?S.redLog:S.blueLog).unshift({t:now(),girl:g.id,room:r})}if(g.priv)endPriv(g);g.tables=(g.tables||0)+1;if(g.room&&g.room!=r){log(`⚠ 撞檯：${g.name} 已在 ${g.room}，改派 ${r}`);leave(g,'撞檯改派')}if(S.rooms[r])S.rooms[r].sent=(S.rooms[r].sent||0)+1;g.status='在檯';g.room=r;g.start=now();g.until=now()+C().tableMin*60000;g.src=src;g.warned=false;log(`${g.name} → ${r}（${src=='blue'?'藍筆（店家勾選）':src=='red'?'紅筆（客人點檯）':src=='auto'?'同台自動轉':src=='tag'?'手環感應':src=='fill'?'系統自動補人':'派檯'}）`)}
function leave0(g,why){if(g.priv)endPriv(g);if(g.room)log(`${g.name} 離開 ${g.room}（${why}）`);g.status='休息';g.room=null;g.until=now()+C().breakMin*60000;g.src=''}
function assign(r){const free=S.girls.filter(g=>(g.on||g.ext)&&g.room!=r);if(!free.length)return alert('沒有可派的女孩（請先上班打卡）');
const f=document.getElementById('dform');f.innerHTML=`<h3>藍筆（店家勾選）→ ${r}</h3>`+free.map(g=>`<button value="${g.id}">${g.name}（${g.status}${g.room?' '+g.room+' ⚠撞檯':''}）</button> `).join('')+'<p><label><input type=checkbox id=holdOnly> 只保檯（保留，不入房）</label><label><input type=checkbox id=priv> 私檯（'+C().privPrice+' 元 / '+C().privBlockMin+' 分）</label><button class="s" value="">取消</button></p>';
const d=document.getElementById('dlg');d.onclose=()=>{if(d.returnValue){const gg=G(d.returnValue);const bk=bookedRooms(gg,r);if(bk.length>=C().bookedMax&&!confirm(`⚠ ${gg.name} 已點滿 ${bk.length} 間（${bk.join('、')}），仍要派往 ${r}？`)){log(`⚠ 點滿警示：${gg.name} 派往 ${r} 已取消`);return}if(document.getElementById('holdOnly').checked){hold(gg.id,r);return}if(gg.room&&!confirm(gg.name+' 已在 '+gg.room+'，確定撞檯改派？'))return;seat(gg,r,'blue');log(`【藍筆】店家勾選 ${gg.name} → ${r}`);if(document.getElementById('priv').checked)setPriv(gg);render()}};d.returnValue='';d.showModal()}
function clock(id){const g=G(id);g.on=!g.on;g.leave=false;todayRec(g);if(g.on){g.status='休息室';g.idleSince=now();log(g.name+' 上班打卡')}else{if(g.room)leave(g,'下班');g.status='休息室';S.autos.forEach(a=>a.girls=a.girls.filter(x=>x!=id));log(g.name+' 下班打卡')}render()}
function openAuto(){const busy=Object.keys(S.rooms);const girls=S.girls.filter(g=>g.on);if(busy.length<2||girls.length<2)return alert('需要至少 2 間有客包廂與 2 位上班女孩');
const f=document.getElementById('dform');f.innerHTML='<h3>同台互轉（最多 3 人 / 3 間，環狀 A→B→C→A）</h3><p>包廂：'+busy.map(r=>`<label style="display:inline"><input type=checkbox name=r value="${r}">${r}</label> `).join('')+'</p><p>女孩（依序）：'+girls.map(g=>`<label style="display:inline"><input type=checkbox name=g value="${g.id}">${g.name}</label> `).join('')+'</p><button value="ok">開啟 auto</button> <button class="s" value="">取消</button>';
const d=document.getElementById('dlg');d.returnValue='';d.onclose=()=>{if(d.returnValue!='ok')return;const rs=[...f.querySelectorAll('[name=r]:checked')].map(x=>x.value),gs=[...f.querySelectorAll('[name=g]:checked')].map(x=>x.value);
if(rs.length<2||rs.length>3||gs.length!=rs.length)return alert('請選 2–3 間包廂，且女孩人數等於包廂數');startAuto(rs,gs)};d.showModal()}
function startAuto(rs,gs){S.girls.filter(g=>gs.includes(g.id)&&g.room).forEach(g=>leave(g,'加入同台'));gs.forEach((id,i)=>seat(G(id),rs[i],'auto'));S.autos.push({rooms:rs,girls:gs});log(`開啟同台互轉：${rs.join('→')}，${gs.map(x=>G(x).name).join('、')}`);render()}
function rotate(a){const moves=a.girls.map(id=>{const g=G(id);return [g,a.rooms[(a.rooms.indexOf(g.room)+1)%a.rooms.length]]});moves.forEach(([g,r])=>{log(`${g.name} 離開 ${g.room}（自動轉檯）`);g.room=null;seat(g,r,'auto')});log('同台互轉完成一輪移動')}
function toast(m,warn){const d=document.createElement('div');d.textContent=m;d.style.cssText='padding:10px 18px;margin:4px;border-radius:8px;font-size:18px;background:'+(warn?'#c33':'#2a8');document.getElementById('toasts').append(d);setTimeout(()=>d.remove(),4000);log((warn?'⚠ ':'📡 ')+m)}
const tagToGirl=tag=>{const e=C().tagMap.split(',').map(x=>x.trim().split('=')).find(([k])=>k==tag);return e&&G(e[1])};
// 唯一入口：日後真實讀卡器（WebSocket 推播）也呼叫此函式
function handleDoorEvent0(ev){const g=tagToGirl(ev.tagId),r=ev.roomId;if(!g){toast(`未知標籤 ${ev.tagId} 於 ${r}`,true);return}
let dir=ev.direction||(g.room==r?'out':'in');const num=g.id+'號';
if(dir=='in'){if(g.room==r){toast(`${num} 已在 ${r}（重複讀取）`);return}
 if(!g.on){g.on=true;g.leave=false;todayRec(g);log(g.name+' 感應自動上班')}
 if(!S.rooms[r])toast(`${num} 進入空房 ${r}`,true);
 else if(!g.room&&g.status!='在檯'&&!g.pending)toast(`${num} 進入 ${r}（未經派檯）`,true);
 if(g.room)toast(`撞檯：${num} 仍登記在 ${g.room}，現進入 ${r}`,true);
 seat(g,r,'tag');toast(`${num} 進入 ${r}（${(C().tagMap.split(',').map(x=>x.trim().split('=')).find(([k])=>k==ev.tagId)||[])[2]||'手環'}）`)}

function bill(x){const b=bill1(x),ex=[...new Set((x.bans||[]).flat())].filter(id=>G(id)&&G(id).ext);ex.forEach(id=>b.items.push([`外找 ${id}號${C().extFee?'':'（不另收）'}`,+C().extFee||0]));b.total=b.items.reduce((a,i)=>a+i[1],0);return b}
function callTick(){const n=now();S.calls=S.calls.filter(c=>{const g=G(c.girl);return g&&g.room==c.room&&g.inRoom===false});
 S.girls.forEach(g=>{if(!g.room||g.inRoom!==false||g.loc=='報到中')return;if(n-(g.outSince||n)>=C().returnMin*60000)addCall('回檯',g,g.room,{loc:g.loc})});
 for(const r in S.rooms){const x=S.rooms[r];if(x.end-n<=C().billMin*60000){if(!x.billCall){x.billCall=true;toast(`${r} 回檯買單`,true);beep()}S.girls.filter(g=>g.room==r&&g.inRoom===false).forEach(g=>addCall('回檯買單',g,r,{loc:g.loc}))}else x.billCall=false}}
function tick(){callTick();tick0()}
const waitTxt=c=>{const m=Math.floor((now()-c.t)/60000);return m+' 分'};
function callHTML(c,big){const g=G(c.girl),over=c.type=='報到'&&now()-c.t>C().reportMin*60000;const lbl=c.type=='報到'?`${c.girl} → ${c.room}`:c.type=='回檯'?`${c.girl} 請回檯 → ${c.room}`:`${c.girl} 回檯買單 → ${c.room}`;
 return`<div class="call ${over?'over':''}" style="background:${CT[c.type]}"><div class=cl>${lbl}</div><div class=cs>${c.type}${g&&g.ext?'・外找':''}${c.loc&&c.type!='報到'?(c.loc=='報到中'?'・尚未報到':'・在 '+esc(c.loc)):''}・等 ${waitTxt(c)}${over?' ⚠逾時':''} <button class=s onclick="S.calls=S.calls.filter(z=>z.id!='${c.id}');render()">清除</button></div></div>`}
function renderCalls(){const cs=S.calls.slice().sort((a,b)=>a.t-b.t),bills=Object.keys(S.rooms).filter(r=>S.rooms[r].billCall);
 document.getElementById('callsec').innerHTML=`<div class=h><b>報到／回檯看板（${cs.length}）</b><button onclick="openBoard()">📺 控台大螢幕</button></div>${bills.map(r=>`<span class=pen style="background:#c33;font-size:15px">${r} 回檯買單</span> `).join('')}<div class=calls>${cs.map(c=>callHTML(c)).join('')||'<span style="color:#888">無</span>'}</div>`;
 const bd=document.getElementById('board');if(bd.style.display=='block'){const n=now();bd.innerHTML=`<div class=bh><span>${esc(C().store)}・報到看板</span><span id=bclk>${t(n)}</span><button class=s onclick="closeBoard()">關閉</button></div>${bills.length?`<div class=bbill>${bills.map(r=>r+' 回檯買單').join('　')}</div>`:''}<div class=bgrid>${cs.map(c=>callHTML(c,1)).join('')||'<div style="font-size:40px;color:#666">目前無呼叫</div>'}</div><div class=brooms>${roomList().map(r=>{const x=S.rooms[r];return`<div class=br style="${x&&x.end-n<=C().billMin*60000?'border-color:#f33':''}"><b>${r}</b><br>${x?`${hm(x.end)}<br>剩 ${Math.ceil((x.end-n)/60000)} 分`:S.cleaning[r]?'清潔中':'空房'}</div>`}).join('')}</div>`}}
function openBoard(){const b=document.getElementById('board');b.style.display='block';try{b.requestFullscreen&&b.requestFullscreen().catch(()=>{})}catch(e){}render()}
function closeBoard(){document.getElementById('board').style.display='none';if(document.fullscreenElement)document.exitFullscreen()}
function locTag(g){if(!g.room)return'';const st=g.inRoom===false?`<span class=pen style="background:#a50">${esc(g.loc||'外出')}</span>`:'';return`${g.ext?'<span class=pen style="background:#088">外找</span>':''}${st}<span class=lb><a onclick="setLoc('${g.id}','在房')">在房</a><a onclick="setLoc('${g.id}','休息室')">休息室</a><a onclick="setLoc('${g.id}','餐廳')">餐廳</a></span>`}
// 外找
function openExt(){const f=document.getElementById('dform'),off=S.girls.filter(g=>!g.on&&!g.ext);const ex=S.girls.filter(g=>g.ext);
 f.innerHTML=`<h3>外找（臨時叫人）</h3>${ex.map(g=>`<div class=h><span>${esc(g.name)}・${g.extState}${g.extSrc?'・'+esc(g.extSrc):''}${g.room?'・'+g.room:''}</span><span>${g.extState=='聯絡中'?`<button type=button onclick="extArrive('${g.id}')">已到店</button>`:''} <button type=button class=s onclick="extEnd('${g.id}')">結束外找</button></span></div>`).join('')||'<p>目前無外找</p>'}
 <h4>叫名冊內未上班的小姐</h4><select id=exG>${off.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select> <button type=button onclick="extCall(exG.value)">外找她</button>
 <h4>新增臨時／外部小姐</h4><label>編號 <input id=exI style="width:70px" placeholder="例 T1"></label><label>藝名 <input id=exN></label><label>來源/備註（可空白）<input id=exS></label><button type=button onclick="extNew()">新增並外找</button><p><button class=s value="">關閉</button></p>`;const d=document.getElementById('dlg');d.onclose=null;if(!d.open)d.showModal()}
function extCall(id){const g=G(id);if(!g)return;g.ext=true;g.extState='聯絡中';log(`外找：聯絡 ${g.name}`);render();openExt()}
function extNew(){const id=exI.value.trim();if(!id)return alert('請填編號');if(G(id))return alert('編號已存在');S.girls.push({id,name:id+' '+(exN.value.trim()||'外找'),leave:false,on:false,status:'休息室',room:null,start:0,until:0,src:'',ext:true,extState:'聯絡中',extSrc:exS.value.trim(),temp:true});log(`外找：新增臨時小姐 ${id}`);render();openExt()}
function extArrive(id){const g=G(id);g.extState='已到店';if(!g.on)clock(id);log(`外找 ${g.name} 已到店`);render();openExt()}
function extEnd(id){const g=G(id);if(g.room)leave(g,'結束外找');g.ext=false;g.extState=null;if(g.on)clock(id);if(g.temp)S.girls=S.girls.filter(z=>z.id!=id);log(`結束外找 ${g.name}`);render();openExt()}

document.getElementById('op').value=S.op||'';render();setInterval(tick,1000);
</script></body></html>
