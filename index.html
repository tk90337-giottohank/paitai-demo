<script>
const K='hostessMVP_v5';const ROSTER=[["01", "甜蜜"], ["02", "喬喬"], ["05", "YY"], ["06", "愛心"], ["07", "甜甜"], ["08", "宣宣"], ["09", "可樂"], ["10", "翠翠"], ["11", "依依"], ["12", "可心"], ["13", "婷婷"], ["15", "LYLY"], ["16", "小薇"], ["17", "布丁"], ["18", "晶晶"], ["19", "小愛"], ["20", "多多"], ["22", "小花"], ["23", "露西"], ["25", "小小"], ["26", "蜜桃"], ["28", "百合"], ["29", "海倫"], ["30", "珊妮"], ["31", "如意"], ["32", "KK"], ["33", "珊珊"], ["35", "葡萄"], ["36", "娜娜"], ["37", "可愛"], ["52", "珍珍"], ["55", "紅茶"], ["57", "燕子"], ["58", "COCO"], ["59", "糖果"], ["60", "菲菲"], ["62", "愛莉"], ["63", "星星"], ["65", "寶兒"], ["66", "小桃"], ["67", "小云"], ["68", "小玉"], ["69", "恩恩"], ["70", "欣儀"], ["71", "蜜兒"], ["75", "娃娃"], ["76", "小咪"], ["77", "LaLa"], ["79", "巧克力"], ["80", "A咪"], ["81", "凱莉"], ["82", "安安"], ["85", "小寶"], ["86", "櫻桃"], ["88", "AA"], ["89", "瑤瑤"], ["90", "兔兔"], ["91", "佳佳"], ["92", "寶寶"], ["93", "依琳"], ["95", "MoMo"], ["96", "天兒"], ["97", "YoYo"], ["98", "小不點"], ["99", "水水"]];
const now=()=>Date.now();
const seed=()=>({cfg:{store:'我的店',rooms:'206,207,208,VIP,111,201,202,203,205',sessionMin:120,tableMin:20,renewMin:20,holdMin:10,breakMin:10,autoFill:'開',pkg1:5000,pkg2:6800,pkgInc:1000,pkgGirls:2,tablePrice:600,privTai:5,privInclDeduct:'是',privLegacy:'否',renewPkg:'是',renewDrink:'是',offDays:5,bonus:5000,noShowCounts:'是',bookedMax:3,freeWithinMin:5,privPrice:1800,privBlockMin:120,busyRotMin:30,visitMin:10,baoRules:'5保2,7保3,9保4,10保5',tagMap:ROSTER.map(([x])=>'TAG'+x+'='+x+'=手環').join(',')},
rooms:{},mode:'閒',waiting:0,op:'',decisions:[],att:{},reqs:[],redLog:[],blueLog:[],girls:ROSTER.map(([x,nm])=>({id:x,name:x+' '+nm,leave:false,on:false,status:'休息室',room:null,start:0,until:0,src:''})),autos:[],log:[]});
let S=JSON.parse(localStorage.getItem(K)||'null')||seed();
const TVMODE=location.hash=='#tv';const save=()=>{if(!TVMODE)localStorage.setItem(K,JSON.stringify(S))};const C=()=>S.cfg;const roomList=()=>C().rooms.split(',').map(s=>s.trim()).filter(Boolean);
const t=ts=>new Date(ts).toLocaleTimeString('zh-TW',{hour12:false});const mmss=ms=>{ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return m+':'+String(s).padStart(2,'0')};
function log(m){S.log.unshift(t(now())+' '+m);S.log=S.log.slice(0,200);save()}
const G=id=>S.girls.find(g=>g.id==id);
function checkIn0(r){const rules=C().baoRules.split(',').map(x=>x.trim());const f=document.getElementById('dform');
f.innerHTML=`<h3>${r} 開番（${C().sessionMin} 分）</h3><label>客人人數 <input id=ciN type=number value=2 min=1 style="width:60px"></label><label>套餐酒水 <select id=ciD><option>啤酒一手</option><option>高粱一瓶</option></select></label><label>保檯 <select id=ciB><option value="">不保（套餐 ${C().pkgGirls} 位）</option>${rules.map(x=>`<option>${x}</option>`).join('')}</select></label><button value=ok>開番</button> <button class=s value="">取消</button>`;
const d=document.getElementById('dlg');d.returnValue='';d.onclose=()=>{if(d.returnValue=='ok')doCheckIn(r,+ciN.value,ciD.value,ciB.value)};d.showModal()}
function doCheckIn0(r,n,drink,br){const mm=(br||'').match(/(\d+)保(\d+)/);S.rooms[r]={bao:mm?{n:+mm[1],m:+mm[2]}:null,sent:0,guests:n,drink,bans:[[]],start:now(),end:now()+C().sessionMin*60000,sessions:1,warned:false};log(`${r} 開番 ${n} 人，${drink}，保檯 ${br||'不保'}，套餐 ${pkgPrice(n)} 元`);render()}
const pkgPrice=n=>n<=1?C().pkg1:C().pkg2+(n-2)*C().pkgInc;
function bill0(x){const items=[],pk=pkgPrice(x.guests),bans=x.bans||[[]],nPk=C().renewPkg=='是'?x.sessions:1;
 items.push([`套餐 ${x.guests} 人 × ${nPk} 番`,pk*nPk]);items.push([`含酒水：${x.drink||'—'} × ${C().renewDrink=='是'?x.sessions:1}`,0]);
 const base=C().pkgGirls,tp=C().tablePrice,legacy=C().privLegacy=='是';bans.forEach((b,i)=>{const pr=(x.privBans||[])[i]||[];let ex=0;
  b.forEach((id,k)=>{const inc=k<base;if(pr.includes(id)&&!legacy){const n=inc&&C().privInclDeduct=='是'?C().privTai-1:C().privTai;items.push([`第 ${i+1} 番 私檯 ${id}號 × ${n} 台 × ${tp}${inc?'（套餐內）':''}`,n*tp])}else if(!inc)ex++});
  if(ex)items.push([`第 ${i+1} 番 加台 ${ex} 台 × ${tp}`,ex*tp])});
 if(legacy){const pv=(x.privTotal||0)+S.girls.filter(g=>g.priv&&g.priv.room==x.id).reduce((a,g)=>a+privCharge(g.priv),0);if(pv)items.push(['私檯（舊制 '+C().privPrice+' 元/段）',pv])}
 return{items,total:items.reduce((a,i)=>a+i[1],0)}}
function renew0(r){const x=S.rooms[r];x.end+=C().sessionMin*60000;x.sessions++;(x.bans=x.bans||[[]]).push(S.girls.filter(g=>g.room==r).map(g=>g.id));(x.privBans=x.privBans||[])[x.bans.length-1]=S.girls.filter(g=>g.room==r&&g.priv).map(g=>g.id);x.warned=false;log(`${r} 續番（第 ${x.sessions} 番，+${C().renewPkg=='是'?pkgPrice(x.guests):0} 元）`);render()}

function parseCheckinTxt(txt,defDay){let d=defDay;const list=[],bad=[],unk=[],tbd=[];txt.split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&!l.startsWith('#')).forEach(l=>{const c=l.split(/[,，\t]/).map(x=>x.trim());if(c[0]=='日期'){d=c[1];return}if(c[0]=='順序')return;if(c.length<3)return bad.push(l);
  const id=nid(c[1]);if(!id||!G(id))return unk.push(`順序${c[0]} 小姐「${c[1]}」`);const tm=parseTime(c[2]),off=c[3]?parseTime(c[3]):null;if(!tm)tbd.push(`順序${c[0]} 報到時間「${c[2]}」`);if(c[3]&&!off)tbd.push(`順序${c[0]} 下班時間「${c[3]}」`);list.push({order:+c[0]||list.length+1,id,tm,off})});return{type:'報班順序',day:d,list,bad,unk,tbd}}
function parseStaffTxt(txt){let m=null;const list=[],bad=[],unk=[],tbd=[];txt.split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&!l.startsWith('#')).forEach(l=>{const c=l.split(/[,，\t]/).map(x=>x.trim());if(c[0]=='月份'){m=c[1];return}if(c[0]=='編號')return;if(c.length<3)return bad.push(l);
  if(!S.staff.some(s=>s.id==c[0]))return unk.push(`少爺「${c[0]}」不在名冊`);const day=+c[1];if(!(day>=1&&day<=31))return bad.push(l);if(!['上班','休','請假','曠職',''].includes(c[2]))tbd.push(`${c[0]} ${day}日 狀態「${c[2]}」`);list.push({sid:c[0],day,st:c[2],sh:c[3]||''})});return{type:'少爺排班',month:m,list,bad,unk,tbd}}

function liveConflict(r,st){const x=S.rooms[r.room];if(!x||st==null)return null;const bs=(x.bans||[[]]).map((b,i)=>(x.banStart||[])[i]||(i==0?x.start:x.start+i*C().sessionMin*60000));const i=bs.findIndex(s=>Math.abs(s-st)<=30*60000);if(i>=0)return{room:r.room,ban:i};if(!r.ended&&st>=x.start-30*60000)return{room:r.room,ban:bs.length-1};return null}

function previewHTML(p){let body='',n=0;const warn=(t,a,c)=>a.length?`<div style="color:${c}"><b>${t}（${a.length}）</b>：${a.map(esc).join('、')}</div>`:'';
 if(p.type=='排檯表'){if(!/^\d{4}-\d{2}-\d{2}$/.test(p.day||''))return'<p style="color:#f66">日期格式錯誤</p>';const prev=S.sheetLog.filter(e=>e.imp&&e.day==p.day).length;
  const rs=Object.values(p.rows).map(r=>{const st=r.tm?dayTs(p.day,...r.tm):null,cf=liveConflict(r,st),ms=p.marks.filter(m=>m[0]==r.seq);return{r,st,cf,ms}});n=rs.length;

 else if(p.type=='報班順序'){n=p.list.length;const ex=(S.checkin[p.day]||[]).length;body=`<p>${p.day}：${n} 位報班${ex?`・<b style="color:#fc6">將取代此日原有的 ${ex} 筆報班順序</b>`:''}</p><div class=tw><table class=sch><tr><th>順序</th><th>小姐</th><th>報到</th><th>下班</th></tr>${p.list.map(c=>`<tr><td>${c.order}</td><td>${esc(G(c.id).name)}</td><td>${c.tm?c.tm.map(x=>String(x).padStart(2,'0')).join(':'):'待確認'}</td><td>${c.off?c.off.map(x=>String(x).padStart(2,'0')).join(':'):''}</td></tr>`).join('')}</table></div>`}
 else{n=p.list.length;if(!/^\d{4}-\d{2}$/.test(p.month||''))return'<p style="color:#f66">月份格式錯誤</p>';const ex=p.list.filter(c=>((S.sched[p.month]||{})[c.sid]||{})[c.day]).length;body=`<p>${p.month}：${n} 格${ex?`・<b style="color:#fc6">其中 ${ex} 格會覆蓋原有內容</b>`:''}</p>`}
 return`<section style="margin-top:8px"><h3>預覽：${p.type}</h3>${warn('無法讀取的行',p.bad,'#f66')}${warn('不在名冊的編號（不會匯入）',p.unk,'#f66')}${warn('待確認',p.tbd,'#fc6')}${body}${n?`<p><button onclick="miCommit()" style="background:#c80">確認匯入</button> <button class=s onclick="MI.parsed=null;openManualImport()">取消</button></p>`:''}</section>`}

function snapState(){const c=JSON.parse(JSON.stringify(S));delete c.impSnap;delete c.impAudit;delete c.log;return c}
function miCommit(){if(!needRole(2))return;const reason=(document.getElementById('miR').value||'').trim();if(!reason){alert('請填「人工干預原因」');return document.getElementById('miR').focus()}

function applySheet(p,pol){const d=p.day;const old=S.sheetLog.filter(e=>e.imp&&e.day==d).length;
 ['sheetLog','taiLog','orderBonus','redLog','blueLog'].forEach(k=>S[k]=S[k].filter(e=>!(e.imp&&e.day==d)));const cnt={};let add=0,skip=0,merge=0,rep=0,live=0;
 Object.values(p.rows).sort((a,b)=>(a.tm?dayTs(d,...a.tm):0)-(b.tm?dayTs(d,...b.tm):0)).forEach(r=>{const st=r.tm?dayTs(d,...r.tm):dayTs(d,C().dayCut,0),mk={};p.marks.filter(m=>m[0]==r.seq).forEach(([,id,ty])=>{(mk[id]=mk[id]||[]).push(ty)});const girls=Object.keys(mk),privs=girls.filter(id=>mk[id].includes('私檯')),order=girls.filter(id=>mk[id].includes('訂番'));
  const cf=liveConflict(r,r.tm?st:null);
  if(cf){if(pol=='skip'){skip++;return}const x=S.rooms[cf.room],i=cf.ban;x.bans[i]=x.bans[i]||[];x.privBans=x.privBans||[];x.privBans[i]=x.privBans[i]||[];
   if(pol=='replace'){x.bans[i]=girls.slice();x.privBans[i]=privs.slice();x.order=order.slice();if(r.guests)x.guests=r.guests;if(r.tm){if(i==0&&x.sessions==1){x.start=x.sesStart=st;x.end=st+sessLen(st)}else(x.banStart=x.banStart||[x.start])[i]=st}rep++}
   else{girls.forEach(id=>{if(!x.bans[i].includes(id))x.bans[i].push(id)});privs.forEach(id=>{if(!x.privBans[i].includes(id))x.privBans[i].push(id)});x.order=[...new Set([...(x.order||[]),...order])];if(x.guests==null&&r.guests)x.guests=r.guests;merge++}
   girls.forEach(id=>{if(mk[id].includes('紅'))S.redLog.push({t:st,girl:id,room:cf.room,imp:true,day:d});else if(mk[id].includes('藍'))S.blueLog.push({t:st,girl:id,room:cf.room,imp:true,day:d});if(order.includes(id))S.orderBonus.push({t:st,room:cf.room,girl:id,girlAmt:C().orderGirlBonus,staffAmt:C().orderStaffBonus,staff:S.cur.name,imp:true,day:d})});return}
  cnt[r.room]=(cnt[r.room]||0)+1;
  if(!r.ended&&roomList().includes(r.room)&&!S.rooms[r.room]&&r.tm){S.rooms[r.room]={drink:'待補',bans:[girls],privBans:[privs],bao:null,sent:0,guests:r.guests,start:st,sesStart:st,end:st+sessLen(st),sessions:1,warned:false,orders:[],beer:{百威:0,金牌:0},order,note:'',holiday:isHoliday(st),imp:true};live++}
  else{S.sheetLog.push({day:d,room:r.room,ban:cnt[r.room],start:st,guests:r.guests,girls,privs,order,marks:mk,ended:r.ended,why:r.ended?'匯入':'',imp:true});girls.forEach(id=>S.taiLog.push({day:d,room:r.room,ban:cnt[r.room],girl:id,tai:privs.includes(id)?C().privTai:1,priv:privs.includes(id),t:st,imp:true}));add++}
  girls.forEach(id=>{if(mk[id].includes('紅'))S.redLog.push({t:st,girl:id,room:r.room,imp:true,day:d});else if(mk[id].includes('藍'))S.blueLog.push({t:st,girl:id,room:r.room,imp:true,day:d});if(order.includes(id))S.orderBonus.push({t:st,room:r.room,girl:id,girlAmt:C().orderGirlBonus,staffAmt:C().orderStaffBonus,staff:S.cur.name,imp:true,day:d})})});
 return{'新增列':add,'開啟現場包廂':live,'取代舊匯入':old,'略過衝突':skip,'合併':merge,'取代現場':rep,'記號':p.marks.length,'略過編號':p.unk.length}}
function applyCheckin(p){const d=p.day,isToday=d==bizDay(now());S.checkin[d]=p.list.map(c=>({order:c.order,id:c.id,t:c.tm?dayTs(d,...c.tm):null}));S.att[d]=S.att[d]||{};S.clockOut[d]=S.clockOut[d]||{};let off=0;
 p.list.forEach(c=>{S.att[d][c.id]='上班';const g=G(c.id);if(c.off){S.clockOut[d][c.id]=dayTs(d,...c.off);off++;if(isToday){g.offAt=S.clockOut[d][c.id]}}if(isToday&&c.tm){g.clockAt=dayTs(d,...c.tm)}});return{'報班':p.list.length,'下班':off,'略過編號':p.unk.length}}
function applyStaff(p){const m=p.month;S.sched[m]=S.sched[m]||{};p.list.forEach(c=>{const row=(S.sched[m][c.sid]=S.sched[m][c.sid]||{});if(!c.st&&!c.sh)delete row[c.day];else row[c.day]={st:c.st,sh:c.sh}});return{'格數':p.list.length,'略過':p.unk.length}}

 {id:'over',zh:'時間到',vi:'Hết giờ'},{id:'bill',zh:'小姐回檯買單',vi:'Các em về phòng tính tiền'},{id:'ret',zh:'回檯',vi:'Quay lại phòng'},{id:'find',zh:'外找',vi:'Có người tìm em'},
 {id:'bao',zh:'報檯',vi:'Báo phòng',sub:'加時／急報檯・Thêm giờ / Gấp'},{id:'wait',zh:'客人等房',vi:'Khách chờ phòng'},{id:'dance',zh:'放音樂跳舞啦妹妹們',vi:'Bật nhạc nhảy nào các em ơi'}],cbVer:2,cards:[],dis:{},seen:{},log:[]}}
if(S.cb.cbVer!=2){const OLD={over:'HẾT GiỜ',bill:'Hũy THÃi Mãi TAN',ret:'HUỹ THÃi',find:'',bao:'BÁO THÃi',wait:'KHÁCH CHỜ PHONG',dance:'Bấm nhạc nhảy mấy em ơi'},NEW={over:'Hết giờ',bill:'Các em về phòng tính tiền',ret:'Quay lại phòng',find:'Có người tìm em',bao:'Báo phòng',wait:'Khách chờ phòng',dance:'Bật nhạc nhảy nào các em ơi'},OZH={add:'加時',urgent:'急報檯',bao:'報檯'};
 S.cb.msgs=S.cb.msgs.filter(m=>!((m.id=='add'||m.id=='urgent')));S.cb.msgs.forEach(m=>{if(OLD[m.id]!==undefined&&m.vi==OLD[m.id])m.vi=NEW[m.id];if(m.id=='bao'){if(m.zh==OZH.bao&&m.sub===undefined)m.sub='加時／急報檯・Thêm giờ / Gấp'}});
 if(!S.cb.msgs.some(m=>m.id=='bao'))S.cb.msgs.splice(4,0,{id:'bao',zh:'報檯',vi:'Báo phòng',sub:'加時／急報檯・Thêm giờ / Gấp'});
 S.cb.cards.forEach(c=>{if(c.msg=='add'||c.msg=='urgent')c.msg='bao'});S.cb.cbVer=2;cbLogSafe('訊息卡更新：標準越南文、加時／急報檯併入報檯');save()}
function cbLogSafe(m){(S.cb.log=S.cb.log||[]).unshift(t(now())+' '+m)}
const CBM=id=>S.cb.msgs.find(m=>m.id==id)||{zh:id,vi:''};
let CBsel={room:'',msg:'',girls:[],custom:'',all:false};
function cbLog(m){S.cb.log.unshift(t(now())+' '+m);S.cb.log=S.cb.log.slice(0,300)}
function cbAuto(){const out=[],n=now();
 for(const r in S.rooms){const x=S.rooms[r];if(x.end<n)out.push({key:'over|'+r+'|'+x.end,room:r,msg:'over',girls:[],t:x.end,auto:1});
  else if(x.billCall){const gs=S.girls.filter(g=>g.room==r&&g.inRoom===false).map(g=>g.id);out.push({key:'bill|'+r+'|'+x.end,room:r,msg:'bill',girls:gs,t:x.end-C().billMin*60000,auto:1})}}
 (S.calls||[]).forEach(c=>{if(c.type=='外找')out.push({key:'find|'+c.id,room:/^\d|VIP/.test(c.room)&&roomList().includes(c.room)?c.room:'',msg:'find',girls:[c.girl],t:c.t,auto:1,note:c.room+(c.who?'・'+c.who:'')});
  if(c.type=='回檯')out.push({key:'ret|'+c.id,room:c.room,msg:'ret',girls:[c.girl],t:c.t,auto:1})});
 const live=out.filter(c=>!S.cb.dis[c.key]);live.forEach(c=>{if(!S.cb.seen[c.key]){S.cb.seen[c.key]=n;cbLog(`自動：${c.room||''} ${CBM(c.msg).zh} ${c.girls.join(',')}`)}});return live}
function cbCards(){return[...S.cb.cards,...cbAuto()].sort((a,b)=>b.t-a.t)}
function cbPost(){const s=CBsel;if(!s.msg&&!s.custom.trim())return alert('請選訊息或輸入自訂文字');const c={key:'m|'+now(),room:s.room,msg:s.msg||'',custom:s.msg?'':s.custom.trim(),girls:s.girls.slice(),t:now(),by:S.op||''};S.cb.cards.unshift(c);cbLog(`張貼：${c.room||''} ${c.msg?CBM(c.msg).zh:c.custom} ${c.girls.join(',')}（${S.op||'未登入'}）`);CBsel={room:'',msg:'',girls:[],custom:'',all:s.all};save();openCallBoard()}
function cbRemove(key){const i=S.cb.cards.findIndex(c=>c.key==key);if(i>=0){const c=S.cb.cards.splice(i,1)[0];cbLog(`移除：${c.room||''} ${c.msg?CBM(c.msg).zh:c.custom}`)}else{S.cb.dis[key]=now();cbLog('移除自動卡：'+key.split('|').slice(0,2).join(' '))}save();if(document.getElementById('page').style.display=='block')openCallBoard();else render()}
function cbMove(key,d){const a=S.cb.cards,i=a.findIndex(c=>c.key==key),j=i+d;if(i<0||j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];a.forEach((c,k)=>c.t=now()-k*1000);save();openCallBoard()}
function cbCardHTML(c,big){const m=c.msg?CBM(c.msg):{zh:c.custom,vi:''},fresh=now()-c.t<15000;
 return`<div class="cbc ${fresh?'cbnew':''} ${c.auto?'cbauto':''}">${c.room?`<div class=cbr>${esc(c.room)}</div>`:''}<div class=cbm>${m.vi?`<div class=cbvi>${esc(m.vi)}</div>`:''}<div class=cbzh>${esc(m.zh)}</div>${m.sub?`<div class=cbsub>${esc(m.sub)}</div>`:''}${c.note?`<div class=cbnote>${esc(c.note)}</div>`:''}</div>${c.girls.length?`<div class=cbgs>${c.girls.map(id=>{const g=G(id);return`<div class=cbg><span>${esc(g?g.name.replace(/^\S+\s/,''):'')}</span><b>${id}</b></div>`}).join('')}</div>`:''}${big?'':`<div class=cbx><button class=s onclick="cbRemove('${c.key}')">移除</button>${c.auto?' <small>自動</small>':` <button class=s onclick="cbMove('${c.key}',-1)">↑</button><button class=s onclick="cbMove('${c.key}',1)">↓</button>`}</div>`}</div>`}
const girlCard=(g,sel,fn)=>`<button class="cbg cbtray ${sel?'cbsel':''}" onclick="${fn}"><span>${esc(g.name.replace(/^\S+\s/,''))}</span><b>${g.id}</b></button>`;
function openCallBoard(){const s=CBsel,cs=cbCards(),pool=s.all?S.girls:S.girls.filter(g=>g.on);
 pageOpen(`<h2>叫檯看板 <button onclick="openCallTV()">📺 全螢幕（本機）</button> <button class=s onclick="window.open(location.pathname+'#tv','cbtv')">🖥 開新視窗給休息室電視</button></h2>
 <div class=cbboard>${cs.map(c=>cbCardHTML(c)).join('')||'<div style="color:#888;padding:20px">白板目前空白</div>'}</div>
 <section><b>1. 包廂</b>（可不選）<div class=chips>${['',...roomList()].map(r=>`<button class="${s.room==r?'':'s'}" onclick="CBsel.room='${r}';openCallBoard()">${r||'不指定'}</button>`).join('')}</div>
 <b>2. 訊息</b><div class=chips>${S.cb.msgs.map(m=>`<button class="${s.msg==m.id?'':'s'}" onclick="CBsel.msg=CBsel.msg=='${m.id}'?'':'${m.id}';openCallBoard()">${esc(m.zh)}${m.vi?'<br><small>'+esc(m.vi)+'</small>':''}</button>`).join('')}</div>
 <label>或自訂文字 <input value="${esc(s.custom)}" oninput="CBsel.custom=this.value;CBsel.msg=''" placeholder="例：請到控台"></label>
 <b>3. 小姐</b>（可多選・${s.all?'全部名冊':'今日已上班'}）<label style="display:inline"><input type=checkbox ${s.all?'checked':''} onchange="CBsel.all=this.checked;openCallBoard()"> 顯示全部</label>
 <div class=cbtrayw>${pool.map(g=>girlCard(g,s.girls.includes(g.id),`CBsel.girls=CBsel.girls.includes('${g.id}')?CBsel.girls.filter(x=>x!='${g.id}'):[...CBsel.girls,'${g.id}'];openCallBoard()`)).join('')||'<span style="color:#888">今天還沒有小姐上班（可勾「顯示全部」）</span>'}</div>
 <p style="position:sticky;bottom:0;background:#1b1d24;padding:6px 0"><button onclick="cbPost()" style="background:#c80;font-size:18px">張貼到看板：${esc(s.room||'')} ${esc(s.msg?CBM(s.msg).zh:s.custom||'（未選訊息）')} ${s.girls.join(',')}</button></p></section>
 <details><summary><b>編輯訊息卡</b></summary><p>每行：<code>中文|越南文|小字說明</code>（越南文、小字可空白）</p><textarea id=cbMT rows=8 style="width:100%">${esc(S.cb.msgs.map(m=>m.zh+'|'+m.vi+(m.sub?'|'+m.sub:'')).join('\n'))}</textarea><button onclick="cbSaveMsgs()">儲存訊息卡</button></details>
 <details><summary><b>看板紀錄</b></summary><div style="max-height:200px;overflow:auto;font-size:13px">${S.cb.log.map(l=>`<div>${esc(l)}</div>`).join('')||'無'}</div></details>`)}
function cbSaveMsgs(){const old=S.cb.msgs;S.cb.msgs=document.getElementById('cbMT').value.split(/\r?\n/).map(l=>l.split('|')).filter(p=>p[0].trim()).map(([zh,vi,sub])=>{zh=zh.trim();const o=old.find(m=>m.zh==zh);return{id:o?o.id:'u'+Math.random().toString(36).slice(2,7),zh,vi:(vi||'').trim(),sub:(sub||'').trim()}});['over','bill','ret','find'].forEach(id=>{if(!S.cb.msgs.some(m=>m.id==id))S.cb.msgs.push(old.find(m=>m.id==id))});cbLog('訊息卡已更新');save();openCallBoard()}
// 電視顯示
let cbSeenTV={},cbSound=false;
function openCallTV(){document.getElementById('cbtv').style.display='block';try{document.getElementById('cbtv').requestFullscreen().catch(()=>{})}catch(e){}renderTV()}
function closeTV(){if(TVMODE)return;document.getElementById('cbtv').style.display='none';if(document.fullscreenElement)document.exitFullscreen()}
function renderTV(){const el=document.getElementById('cbtv');if(!el||el.style.display!='block')return;const cs=cbCards();let fresh=false;cs.forEach(c=>{if(!cbSeenTV[c.key]){if(Object.keys(cbSeenTV).length)fresh=true;cbSeenTV[c.key]=1}});if(fresh&&cbSound)beep();
 const used=new Set(cs.map(c=>c.room)),free=roomList().filter(r=>!used.has(r)),lounge=S.girls.filter(g=>g.on&&!g.room);
 el.innerHTML=`<div class=tvh><span>${esc(C().store)}・叫檯看板</span><span>${t(now())}</span><span>${cbSound?'':'<button onclick="cbSound=true;beep();renderTV()">🔔 點此啟用提示音</button>'} ${TVMODE?'':'<button class=s onclick="closeTV()">關閉</button>'}</span></div>
 <div class=tvwrap><div class=tvboard>${cs.map(c=>cbCardHTML(c,1)).join('')||'<div class=tvempty>目前沒有叫檯</div>'}</div><div class=tvrooms>${free.map(r=>`<div class=cbr>${esc(r)}</div>`).join('')}</div></div>
 <div class=tvtray>${lounge.map(g=>`<div class=cbg><span>${esc(g.name.replace(/^\S+\s/,''))}</span><b>${g.id}</b></div>`).join('')}</div>`}
window.addEventListener('storage',e=>{if(e.key==K&&e.newValue){S=JSON.parse(e.newValue);render();renderTV()}});

if(TVMODE){document.body.style.overflow='hidden';document.getElementById('cbtv').style.display='block'}
document.getElementById('op').value=S.op||'';render();setInterval(tick,1000);
</script></body></html>
