<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>登入</title><style>*{box-sizing:border-box}body{margin:0;background:#151018;color:#f4eef2;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
header{background:linear-gradient(90deg,#3a1450,#1d1030);padding:14px 16px;font-size:20px;font-weight:800}

.in{background:#2a8}.s{background:#443}.g{background:#fff;color:#222;width:100%}
.hint{color:#aab;font-size:13px;line-height:1.45}
