<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>小姐報班（職員）</title><style>*{box-sizing:border-box}body{margin:0;background:#151018;color:#f4eef2;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
header{background:linear-gradient(90deg,#3a1450,#1d1030);padding:14px 16px;font-size:20px;font-weight:800}
.card{background:#221a2c;margin:12px;padding:14px;border-radius:16px}
.hint{color:#aab;font-size:14px;line-height:1.45}
.rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.room{background:#1c1626;border-radius:12px;padding:12px;min-height:72px}
.room b{display:block;font-size:22px}
.free{color:#8c8}.busy{border:1px solid #c45}
button,.btn{min-height:48px;border:0;border-radius:14px;font-size:17px;font-weight:800;padding:10px 14px;color:#fff}
.b-on{background:linear-gradient(135deg,#2fb47a,#16805a);width:100%;margin:8px 0}
.b-off{background:linear-gradient(135deg,#c4475a,#8a2030);width:100%;margin:8px 0}
.main{background:#3a8fe0;text-align:center;display:block;text-decoration:none}
select,input{width:100%;min-height:48px;font-size:18px;border-radius:12px;border:0;padding:8px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #3a2a44}
.ok{background:#1a4a32;color:#cfe;padding:8px 10px;border-radius:10px}
</style>
