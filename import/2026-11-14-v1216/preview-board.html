<title>看板包廂</title><style>*{box-sizing:border-box}body{margin:0;background:#151018;color:#f4eef2;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif}

.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #3a2a44}
