<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>打卡</title><style>*{box-sizing:border-box}body{margin:0;background:#151018;color:#f4eef2;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
header{background:linear-gradient(90deg,#3a1450,#1d1030);padding:14px 16px;font-size:20px;font-weight:800}
.card{background:#221a2c;margin:12px;padding:14px;border-radius:16px}

button{min-height:52px;border:0;border-radius:14px;font-size:18px;font-weight:800;padding:10px 14px;flex:1;color:#fff}
.in{background:#2a8}.out{background:#c45}.s{background:#443}
.daytot{background:#1e2a22;border:1px solid #3a5;color:#cfe;padding:10px 12px;border-radius:10px;margin:8px 0;font-size:17px}
label{display:block;margin:8px 0 4px}input,select,textarea{width:100%;min-height:44px;font-size:16px;border-radius:10px;border:0;padding:8px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{border:1px solid #3a3144;padding:6px;text-align:center}
.hint{color:#aab;font-size:14px;line-height:1.45}
.qr{width:220px;height:220px;background:#fff;margin:10px auto;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#222;font-weight:800}
.big{width:100%;min-height:48px;margin:8px 0;border-radius:12px;border:0;font-size:18px}
</style>
